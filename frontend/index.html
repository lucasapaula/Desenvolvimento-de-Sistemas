<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CR — Painel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
    <div class="topbar-inner">
        <a href="/" class="brand">
            <div class="brand-mark">CR</div>
            <span class="brand-name">cartoon-themed restaurants</span>
        </a>
        <div class="topbar-right">Painel do Restaurante</div>
    </div>
</header>

<div class="page">
    <div class="page-header">
        <h1>Restaurantes</h1>
        <p>Gerencie os restaurantes e cardápios da plataforma</p>
    </div>

    <div class="grid">
        <aside>
            <div class="panel">
                <div class="panel-header">
                    <h2>Adicionar restaurante</h2>
                </div>
                <div class="panel-body">
                    <div class="field">
                        <label for="nome">Nome do restaurante</label>
                        <input type="text" id="nome" placeholder="Ex: Burger House" autocomplete="off">
                    </div>
                    <button class="btn-primary" onclick="criarRestaurante()">Cadastrar restaurante</button>
                </div>
            </div>
        </aside>

        <section>
            <div class="list-header">
                <h2>Cadastrados</h2>
                <span class="badge" id="contador">0</span>
            </div>
            <div id="lista">
                <div class="state">
                    <div class="state-title">Carregando...</div>
                </div>
            </div>
        </section>
    </div>
</div>

<div class="toast" id="toast"></div>
<script src="/static/script.js" defer></script>
</body>
</html>
